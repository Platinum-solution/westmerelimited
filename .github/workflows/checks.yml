name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes html-validate@11.15.0 *.html

  link-check:
    name: Broken link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude "^tel:"
            --exclude "PLACEHOLDER"
            --exclude "YOUR_FORM_ID"
            --exclude "^https?://(www\.)?westmerecare\.co\.uk"
            --exclude "^https://formspree\.io/f/"
            "./**/*.html"
          fail: true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start static server
        run: |
          npx --yes http-server@14.1.1 . --host 127.0.0.1 --port 4173 --silent &
          npx --yes wait-on@8.0.5 http://127.0.0.1:4173/
      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Comment Lighthouse report on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const rawLinks = `${{ steps.lighthouse.outputs.links }}`;
            let links = {};
            try {
              links = JSON.parse(rawLinks || "{}");
            } catch (error) {
              links = {};
            }

            const reportLines = Object.entries(links).map(([url, reportUrl]) => {
              return `- [${url}](${reportUrl})`;
            });

            const body = [
              "## Lighthouse CI",
              "",
              reportLines.length
                ? reportLines.join("\n")
                : "Lighthouse did not publish report links. Check the workflow logs for details."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
